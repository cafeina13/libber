name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # test_download.py encodes a short Opus file to exercise real tagging.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Offline only. The --network tests call YouTube and Spotify for real:
      # they need credentials, they are rate-limited, and they would make CI
      # fail for reasons that have nothing to do with the commit.
      - name: Run tests
        run: uv run pytest --cov=spt2yt --cov-report=term-missing
