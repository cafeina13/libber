[project]
name = "spt2yt"
version = "0.1.0"
description = "Transfer Spotify playlists into offline Opus files via YouTube Music"
readme = "README.md"
authors = [
    { name = "cafeina13", email = "ulukoseahmetali032@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mutagen>=1.48.1",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.5",
    "spotipy>=2.26.0",
    "uvicorn[standard]>=0.52.4",
    "yt-dlp>=2026.8.19",
    "ytmusicapi>=1.12.2",
]

[project.scripts]
spt2yt = "spt2yt.__main__:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are opt-in: they hit YouTube and Spotify for real, so they are
# slow and go red when a service changes something. Run them with --network.
addopts = "-m 'not network' --strict-markers"
markers = [
    "network: hits a live service; needs --network to run",
    "spotify: additionally needs Spotify credentials configured",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
